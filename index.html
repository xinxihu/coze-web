<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>欢迎使用小科 - 智能体学习助手</title>
		 <style>
		        * {
		            margin: 0;
		            padding: 0;
		            box-sizing: border-box;
		            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
		        }
		        
		        body {
		            background: linear-gradient(135deg, #a1d6ff 0%, #c2e9ff 100%);
		            height: 100vh;
		            display: flex;
		            justify-content: center;
		            align-items: center;
		            padding: 20px;
		            color: #333;
		            overflow: hidden;
		        }
		        
		        .main-container {
		            display: flex;
		            width: 100%;
		            max-width: 1200px;
		            height: 90vh;
		            transition: transform 0.5s ease;
		            justify-content: center;
		        }
		        
		        .main-container.shifted {
		            transform: translateX(-15%);
		        }
		        
		        .container {
		            max-width: 800px;
		            width: 100%;
		            background-color: rgba(255, 255, 255, 0.9);
		            border-radius: 20px;
		            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
		            overflow: hidden;
		            animation: fadeIn 1s ease-out;
		            backdrop-filter: blur(5px);
		            display: flex;
		            flex-direction: column;
		        }
		        
		        @keyframes fadeIn {
		            from { opacity: 0; transform: translateY(20px); }
		            to { opacity: 1; transform: translateY(0); }
		        }
		        
		        .header {
		            background: linear-gradient(90deg, #ffcc80 0%, #ffb74d 100%);
		            padding: 20px;
		            text-align: center;
		            color: white;
		            position: relative;
		            flex-shrink: 0;
		        }
		        
		        .header h1 {
		            font-size: 2.2rem;
		            margin-bottom: 8px;
		            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
		        }
		        
		        .header p {
		            font-size: 1.1rem;
		            opacity: 0.9;
		        }
		        
		        .content {
		            padding: 20px;
		            display: flex;
		            flex-direction: column;
		            align-items: center;
		            justify-content: center;
		            flex: 1;
		            overflow: hidden;
		        }
		        
		        .robot-container {
		            width: 80px;
		            height: 80px;
		            margin: 10px auto;
		            position: relative;
		            animation: float 3s ease-in-out infinite;
		        }
		        
		        .robot {
		            width: 90%;
		            height: 90%;
		            background: #8bc9ff;
		            border-radius: 50% 50% 40% 40%;
		            position: relative;
		            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
		        }
		        
		        .robot-face {
		            position: absolute;
		            width: 80%;
		            height: 70%;
		            top: 15%;
		            left: 10%;
		            background: white;
		            border-radius: 40%;
		            display: flex;
		            flex-direction: column;
		            align-items: center;
		            justify-content: center;
		        }
		        
		        .robot-eyes {
		            display: flex;
		            justify-content: space-around;
		            width: 60%;
		            margin-top: 8px;
		        }
		        
		        .eye {
		            width: 8px;
		            height: 8px;
		            background: #4a9df7;
		            border-radius: 50%;
		            animation: blink 4s infinite;
		        }
		        
		        @keyframes blink {
		            0%, 45%, 55%, 100% { transform: scaleY(1); }
		            50% { transform: scaleY(0.1); }
		        }
		        
		        .robot-mouth {
		            width: 40%;
		            height: 3px;
		            background: #ffa94d;
		            border-radius: 5px;
		            margin-top: 10px;
		        }
		        
		        .robot-antenna {
		            position: absolute;
		            top: -8px;
		            left: 50%;
		            transform: translateX(-50%);
		            width: 4px;
		            height: 18px;
		            background: #ffa94d;
		            border-radius: 5px;
		        }
		        
		        .robot-antenna::after {
		            content: '';
		            position: absolute;
		            top: -5px;
		            left: -2px;
		            width: 10px;
		            height: 10px;
		            background: #ffdd00;
		            border-radius: 50%;
		        }
		        
		        @keyframes float {
		            0% { transform: translateY(0); }
		            50% { transform: translateY(-10px); }
		            100% { transform: translateY(0); }
		        }
		        
		        .welcome-text {
		            text-align: center;
		            margin: 15px 0;
		            font-size: 1.1rem;
		            line-height: 1.5;
		            color: #444;
		        }
		        
		        .feature {
		            background: #f0f8ff;
		            border-radius: 15px;
		            padding: 20px;
		            width: 100%;
		            max-width: 450px;
		            text-align: center;
		            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
		            transition: transform 0.3s;
		            margin: 15px 0;
		            border: 2px dashed #8bc9ff;
		        }
		        
		        .feature:hover {
		            transform: translateY(-5px);
		        }
		        
		        .search-icon {
		            font-size: 4rem;
		            margin: 10px auto;
		            color: #4a9df7;
		        }
		        
		        .feature h3 {
		            color: #059ee3;
		            margin-bottom: 10px;
		            font-size: 1.5rem;
		        }
		        
		        .feature p {
		            font-size: 1rem;
		            line-height: 1.5;
		        }
		        
		        .start-button {
		            background: linear-gradient(90deg, #ffcc80 0%, #ffb74d 100%);
		            color: white;
		            border: none;
		            padding: 12px 35px;
		            font-size: 1.2rem;
		            border-radius: 50px;
		            cursor: pointer;
		            margin: 15px 0;
		            box-shadow: 0 5px 15px rgba(255, 179, 102, 0.4);
		            transition: transform 0.3s, box-shadow 0.3s;
		        }
		        
		        .start-button:hover {
		            transform: scale(1.05);
		            box-shadow: 0 8px 20px rgba(255, 179, 102, 0.6);
		        }
		        
		        .footer {
		            text-align: center;
		            padding: 15px;
		            background: rgba(245, 245, 245, 0.7);
		            color: #666;
		            font-size: 0.8rem;
		            flex-shrink: 0;
		        }
		        
		        /* 聊天界面样式 */
		        .chat-container {
		            width: 350px;
		            margin-left: 30px;
		            background-color: white;
		            border-radius: 20px;
		            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
		            overflow: hidden;
		            display: flex;
		            flex-direction: column;
		            opacity: 0;
		            transform: translateX(20px);
		            transition: opacity 0.5s ease, transform 0.5s ease;
		            flex-shrink: 0;
		            position: absolute;
		            right: -420px; /* 初始位置在屏幕外 */
		            top: 50%;
		            transform: translateY(-50%);
		            height: 80vh;
		        }
		        
		        .chat-container.active {
		            opacity: 1;
		            transform: translateY(-50%) translateX(0);
		            right: 30px; /* 激活后显示在屏幕右侧 */
		        }
		        
		        .chat-header {
		            background: linear-gradient(90deg, #4a9df7 0%, #059ee3 100%);
		            padding: 15px;
		            text-align: center;
		            color: white;
		            flex-shrink: 0;
		        }
		        
		        .chat-header h2 {
		            font-size: 1.6rem;
		            margin-bottom: 5px;
		        }
		        
		        .chat-header p {
		            font-size: 0.9rem;
		            opacity: 0.9;
		        }
		        
		        .chat-placeholder {
		            flex: 1;
		            padding: 30px 15px;
		            display: flex;
		            flex-direction: column;
		            align-items: center;
		            justify-content: center;
		            text-align: center;
		            background-color: #f9f9f9;
		            color: #666;
		        }
		        
		        .chat-placeholder p {
		            font-size: 1.1rem;
		            margin-bottom: 15px;
		        }
		        
		        .back-button {
		            background: #ffcc80;
		            color: white;
		            border: none;
		            padding: 8px 16px;
		            border-radius: 20px;
		            cursor: pointer;
		            margin: 10px auto;
		            display: block;
		            font-size: 0.9rem;
		        }
		        
		        @media (max-width: 1000px) {
		            .main-container {
		                flex-direction: column;
		                height: auto;
		            }
		            
		            .main-container.shifted {
		                transform: translateX(0);
		            }
		            
		            .chat-container {
		                width: 100%;
		                margin-left: 0;
		                margin-top: 20px;
		                max-width: 800px;
		                position: static;
		                transform: none;
		                right: auto;
		                top: auto;
		                height: auto;
		            }
		            
		            .chat-container.active {
		                transform: none;
		                right: auto;
		            }
		        }
		        
		        @media (max-width: 600px) {
		            body {
		                padding: 10px;
		            }
		            
		            .header h1 {
		                font-size: 1.6rem;
		            }
		            
		            .robot-container {
		                width: 140px;
		                height: 140px;
		            }
		            
		            .welcome-text {
		                font-size: 1rem;
		            }
		            
		            .feature {
		                width: 100%;
		            }
		        }
		    </style>
	</head>
	<body>
	
	<div class="main-container">
	        <div class="container">
	            <div class="header">
	                <h1>欢迎使用智能体学习助手</h1>
					<h1>—— 小科 ——</h1>
	            </div>
	            
	            <div class="content">
	                <!-- 机器人图标 -->
	                <div class="robot-container">
	                    <div class="robot">
	                        <div class="robot-antenna"></div>
	                        <div class="robot-face">
	                            <div class="robot-eyes">
	                                <div class="eye"></div>
	                                <div class="eye"></div>
	                            </div>
	                            <div class="robot-mouth"></div>
	                        </div>
	                    </div>
	                </div>
	                
	                <div class="welcome-text">
	                    <p>你好！我是小科，你的智能体学习伙伴！</p>
	                    <p>我会陪你一起探索知识的海洋，让学习变得更有趣！</p>
	                </div>
	                
	                <div class="feature">
	                    <!-- 搜索图标 -->
	                    <div class="search-icon">🔍</div>
	                    
	                    <h3>智能问答</h3>
	                    <p>你可以随时向我提问，我会尽力帮助你解答！</p>
	                </div>
	                
	                <button class="start-button">使用指南</button>
	            </div>
	            
	            <div class="footer">
	                <p>小科智能体学习助手 © 2025 | 专为小学信息科技设计</p>
	            </div>
	        </div>
	        
	        <!-- 聊天界面 -->
	        <div class="chat-container">
	            <div class="chat-header">
	                <h2>小科问答</h2>
	                <p>随时为你解答学习问题</p>
	            </div>
	            
	            <div class="chat-placeholder">
	                <p>操作提示：</p>
	                <p>请点击右下角紫色扣子按钮！</p>
					<p>开始与小科对话吧！</p>
	            </div>
	            
	            <button class="back-button">开始学习</button>
	        </div>
	    </div>
	
	    <script>
	        // 获取元素
	        const startButton = document.querySelector('.start-button');
	        const backButton = document.querySelector('.back-button');
	        const mainContainer = document.querySelector('.main-container');
	        const chatContainer = document.querySelector('.chat-container');
	        
	        // 点击开始学习按钮
	        startButton.addEventListener('click', function() {
	            mainContainer.classList.add('shifted');
	            setTimeout(() => {
	                chatContainer.classList.add('active');
	            }, 300);
	            
	            // 添加一些动画效果
	            this.textContent = '已进入问答模式';
	            setTimeout(() => {
	                this.textContent = '使用指南';
	            }, 1500);
	        });
	        
	        // 点击返回按钮 - 只隐藏聊天界面，不改变主页位置
	        backButton.addEventListener('click', function() {
	            chatContainer.classList.remove('active');
	            // 不再移除主容器的shifted类，保持主页偏移状态
	        });
	        
	        // 机器人眼睛跟随鼠标移动（简化版）
	        document.addEventListener('mousemove', function(e) {
	            const eyes = document.querySelectorAll('.eye');
	            const container = document.querySelector('.robot-container');
	            const rect = container.getBoundingClientRect();
	            const centerX = rect.left + rect.width / 2;
	            const centerY = rect.top + rect.height / 2;
	            
	            // 计算鼠标相对于机器人中心的位置
	            const mouseX = e.clientX;
	            const mouseY = e.clientY;
	            
	            // 简单的眼球移动效果
	            eyes.forEach(eye => {
	                const eyeRect = eye.getBoundingClientRect();
	                const eyeCenterX = eyeRect.left + eyeRect.width / 2;
	                const eyeCenterY = eyeRect.top + eyeRect.height / 2;
	                
	                const deltaX = mouseX - eyeCenterX;
	                const deltaY = mouseY - eyeCenterY;
	                
	                // 限制眼球移动范围
	                const maxMove = 2;
	                const moveX = Math.max(-maxMove, Math.min(maxMove, deltaX / 20));
	                const moveY = Math.max(-maxMove, Math.min(maxMove, deltaY / 20));
	                
	                eye.style.transform = `translate(${moveX}px, ${moveY}px)`;
	            });
	        });
	    </script>
	
	<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.10/libs/cn/index.js"></script>

	  });
	</script>
	</body>
</html>
